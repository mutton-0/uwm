<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="Segoe UI, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <rect width="880" height="400" fill="#eaeef2"/>

  <!-- 弹窗 -->
  <rect x="30" y="20" width="540" height="365" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="54" y="56" font-size="18" font-weight="700" fill="#1f2328">Commit changes</text>
  <text x="540" y="56" font-size="16" fill="#59636e">✕</text>
  <line x1="30" y1="72" x2="570" y2="72" stroke="#d0d7de"/>

  <text x="54" y="98" font-size="13" font-weight="700" fill="#1f2328">Commit message</text>
  <rect x="54" y="108" width="492" height="32" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="64" y="129" font-size="13" fill="#1f2328">run_calib 支持 ChArUco 标定板</text>

  <text x="54" y="162" font-size="13" font-weight="700" fill="#1f2328">Extended description</text>
  <rect x="54" y="172" width="492" height="48" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="64" y="193" font-size="13" fill="#8c959f">Add an optional extended description..</text>

  <!-- 选项 1(灰) -->
  <circle cx="64" cy="248" r="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="80" y="253" font-size="13" fill="#8c959f">Commit directly to the <tspan font-weight="700">main</tspan> branch</text>

  <!-- 选项 2 -->
  <circle cx="64" cy="282" r="7" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <circle cx="64" cy="282" r="3.5" fill="#0969da"/>
  <text x="80" y="287" font-size="13" fill="#1f2328">Create a <tspan font-weight="700">new branch</tspan> for this commit and start a pull request</text>
  <rect x="80" y="298" width="300" height="30" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="90" y="318" font-size="13" fill="#1f2328">feature/charuco-support</text>

  <!-- 按钮 -->
  <rect x="342" y="342" width="80" height="32" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="382" y="363" font-size="13" text-anchor="middle" fill="#1f2328">Cancel</text>
  <rect x="432" y="342" width="124" height="32" rx="6" fill="#1f883d"/>
  <text x="494" y="363" font-size="13" text-anchor="middle" fill="#ffffff">Propose changes</text>

  <!-- 红框 -->
  <g fill="none" stroke="#d1242f" stroke-width="3">
    <rect x="52" y="236" width="300" height="26" rx="6" stroke-dasharray="6 4"/>
    <rect x="52" y="270" width="510" height="24" rx="6"/>
    <rect x="74" y="293" width="312" height="40" rx="6"/>
    <rect x="427" y="337" width="134" height="42" rx="8"/>
  </g>
  <g stroke="#d1242f" stroke-width="1.5">
    <line x1="352" y1="249" x2="590" y2="249"/>
    <line x1="562" y1="282" x2="590" y2="282"/>
    <line x1="386" y1="313" x2="590" y2="313"/>
    <line x1="561" y1="358" x2="590" y2="358"/>
  </g>

  <!-- 说明 -->
  <g font-size="14" fill="#d1242f" font-weight="700">
    <text x="596" y="254">① main 已保护,这一项是灰的</text>
    <text x="596" y="287">② 选这一项:新建分支并开 PR</text>
    <text x="596" y="310">③ 默认名是 xxx-patch-1,</text>
    <text x="596" y="328" font-weight="400">改成规范的分支名</text>
    <text x="596" y="363">④ 点 Propose changes</text>
    <text x="596" y="381" font-weight="400">进入开 PR 的页面</text>
  </g>
</svg>
