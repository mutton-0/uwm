<svg xmlns="http://www.w3.org/2000/svg" width="900" height="576" viewBox="0 0 900 576" font-family="Segoe UI, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <rect width="900" height="576" fill="#ffffff"/>

  <!-- 审批前 -->
  <text x="20" y="28" font-size="15" font-weight="700" fill="#1f2328">审批前:还没有人 Approve</text>
  <rect x="20" y="40" width="860" height="170" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="50" cy="72" r="12" fill="#ffffff" stroke="#d1242f" stroke-width="2"/>
  <text x="50" y="77" font-size="14" font-weight="700" text-anchor="middle" fill="#d1242f">!</text>
  <text x="74" y="70" font-size="15" font-weight="700" fill="#1f2328">Review required</text>
  <text x="74" y="92" font-size="13" fill="#59636e">At least 1 approving review is required by reviewers with write access.</text>
  <line x1="20" y1="108" x2="880" y2="108" stroke="#d0d7de"/>
  <circle cx="50" cy="132" r="12" fill="#d1242f"/>
  <text x="50" y="137" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">✕</text>
  <text x="74" y="137" font-size="14" font-weight="700" fill="#d1242f">Merging is blocked</text>
  <rect x="74" y="160" width="190" height="32" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="169" y="181" font-size="13" text-anchor="middle" fill="#8c959f">Merge pull request ▾</text>

  <!-- 审批后 -->
  <text x="20" y="246" font-size="15" font-weight="700" fill="#1f2328">审批后:Owner 已经 Approve</text>
  <rect x="20" y="258" width="860" height="200" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="50" cy="290" r="12" fill="#1f883d"/>
  <text x="50" y="295" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">✓</text>
  <text x="74" y="288" font-size="15" font-weight="700" fill="#1f2328">Changes approved</text>
  <text x="74" y="310" font-size="13" fill="#59636e">1 approving review by reviewers with write access.</text>
  <line x1="20" y1="324" x2="880" y2="324" stroke="#d0d7de"/>
  <rect x="74" y="342" width="170" height="34" rx="6" fill="#1f883d"/>
  <text x="159" y="364" font-size="13" text-anchor="middle" fill="#ffffff">Merge pull request</text>
  <rect x="244" y="342" width="30" height="34" rx="6" fill="#1a7f37"/>
  <text x="259" y="364" font-size="12" text-anchor="middle" fill="#ffffff">▾</text>

  <!-- 下拉菜单 -->
  <rect x="303" y="337" width="560" height="108" rx="8" fill="#d0d7de" opacity="0.5"/>
  <rect x="300" y="334" width="560" height="108" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="301" y="335" width="558" height="36" rx="6" fill="#ddf4ff"/>
  <g font-size="13" xml:space="preserve">
    <text x="314" y="358" fill="#1f2328">✓ <tspan font-weight="700">Create a merge commit</tspan><tspan fill="#59636e">   保留分支上所有 commit,外加一个合并 commit</tspan></text>
    <text x="314" y="394" fill="#1f2328">   <tspan font-weight="700">Squash and merge</tspan><tspan fill="#59636e">   所有 commit 压成一个</tspan></text>
    <text x="314" y="428" fill="#1f2328">   <tspan font-weight="700">Rebase and merge</tspan><tspan fill="#59636e">   逐个接到后面,不产生合并 commit</tspan></text>
  </g>

  <!-- 红框 -->
  <g fill="none" stroke="#d1242f" stroke-width="3">
    <rect x="66" y="118" width="330" height="82" rx="8"/>
    <rect x="240" y="337" width="38" height="44" rx="6"/>
    <rect x="296" y="330" width="568" height="46" rx="8"/>
    <rect x="68" y="337" width="170" height="44" rx="6"/>
  </g>
  <g font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="396" cy="118" r="11" fill="#d1242f"/><text x="396" y="123">1</text>
    <circle cx="278" cy="381" r="11" fill="#d1242f"/><text x="278" y="386">2</text>
    <circle cx="864" cy="330" r="11" fill="#d1242f"/><text x="864" y="335">3</text>
    <circle cx="68" cy="381" r="11" fill="#d1242f"/><text x="68" y="386">4</text>
  </g>

  <!-- 说明 -->
  <g font-size="14" fill="#1f2328">
    <text x="20" y="490"><tspan fill="#d1242f" font-weight="700">①</tspan> 没有人 Approve 时按钮是灰的,谁都合不进去,manager 也不行</text>
    <text x="20" y="514"><tspan fill="#d1242f" font-weight="700">②</tspan> 审批通过后,先点 ▾ 展开合并方式</text>
    <text x="20" y="538"><tspan fill="#d1242f" font-weight="700">③</tspan> 月度合入(monthly → main)选 Create a merge commit;成员 → monthly 可以选 Squash</text>
    <text x="20" y="562"><tspan fill="#d1242f" font-weight="700">④</tspan> 再点左边的绿色按钮,然后点 Confirm merge</text>
  </g>
</svg>
