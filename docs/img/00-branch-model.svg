<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" font-family="Segoe UI, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <rect width="900" height="390" fill="#ffffff"/>

  <!-- 时间段 -->
  <g font-size="13" fill="#59636e" text-anchor="middle">
    <text x="105" y="24">10 月组会后</text>
    <text x="320" y="24">月中:各自在分支开发</text>
    <text x="575" y="24">组会前:提 PR、登记 Sheet、manager 审</text>
    <text x="800" y="24">周一组会:Owner 审</text>
  </g>

  <!-- main -->
  <line x1="30" y1="90" x2="880" y2="90" stroke="#1f883d" stroke-width="4"/>
  <text x="250" y="80" font-size="14" font-weight="700" fill="#1f883d">main(受保护:只能通过 PR 合入,manager 和 Owner 都批准)</text>

  <!-- feature -->
  <path d="M105 90 C 140 90, 140 200, 180 200 L 560 200 C 620 200, 640 90, 700 90" fill="none" stroke="#0969da" stroke-width="4"/>
  <text x="190" y="190" font-size="13" font-weight="700" fill="#0969da">feature/charuco-support(成员 A)</text>

  <!-- dev -->
  <path d="M105 90 C 150 90, 150 290, 200 290 L 600 290 C 680 290, 700 90, 760 90" fill="none" stroke="#bf8700" stroke-width="4"/>
  <text x="210" y="280" font-size="13" font-weight="700" fill="#bf8700">dev/zhengyang(成员 B)</text>

  <!-- commits -->
  <g fill="#ffffff" stroke-width="3">
    <circle cx="260" cy="200" r="7" stroke="#0969da"/>
    <circle cx="340" cy="200" r="7" stroke="#0969da"/>
    <circle cx="420" cy="200" r="7" stroke="#0969da"/>
    <circle cx="300" cy="290" r="7" stroke="#bf8700"/>
    <circle cx="410" cy="290" r="7" stroke="#bf8700"/>
    <circle cx="500" cy="290" r="7" stroke="#bf8700"/>
  </g>
  <circle cx="105" cy="90" r="9" fill="#1f883d"/>
  <circle cx="700" cy="90" r="9" fill="#1f883d"/>
  <circle cx="760" cy="90" r="9" fill="#1f883d"/>

  <!-- tags -->
  <rect x="45" y="40" width="120" height="24" rx="12" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="105" y="57" font-size="12" text-anchor="middle" fill="#0550ae">tag base-2026-10</text>
  <rect x="700" y="40" width="120" height="24" rx="12" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="760" y="57" font-size="12" text-anchor="middle" fill="#0550ae">tag base-2026-11</text>

  <!-- 编号 -->
  <g font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="630" cy="145" r="11" fill="#d1242f"/><text x="630" y="150">1</text>
    <circle cx="688" cy="190" r="11" fill="#d1242f"/><text x="688" y="195">1</text>
    <circle cx="730" cy="118" r="11" fill="#d1242f"/><text x="730" y="123">2</text>
    <circle cx="838" cy="52" r="11" fill="#d1242f"/><text x="838" y="57">3</text>
  </g>

  <!-- 说明 -->
  <g font-size="13" fill="#1f2328">
    <text x="30" y="334">① 成员直接对 main 提 PR,并自己在 Google Sheet 登记(组会前那周的周五之前)</text>
    <text x="30" y="356">② manager 在组会前的周末审,Owner 在周一组会上审,两人都 Approve 后由 manager 合入</text>
    <text x="30" y="378">③ 当月的 PR 都合完后,manager 在 main 上打 tag,作为下个月所有人开发的起点</text>
  </g>
</svg>
